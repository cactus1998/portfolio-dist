    <!-- ✅ Loading 樣式 -->
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      
      body {
        margin: 0;
        font-family: Segoe UI, sans-serif;
        height: 100%;
      }
      
      /* ✅ Loading 畫面 */
      #app-loading {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(to right, #131313, #1f1f1f, #2c2c2c, #1f1f1f, #131313);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 9999;
        transition: opacity 0.5s ease;
      }
      
      /* 釣魚輪 Loading 動畫 */
      .fishing-wheel {
        width: 80px;
        height: 80px;
        border: 6px solid #2c2c2c;
        border-top: 6px solid #fff;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      
      .loading-text {
        color: #fff;
        margin-top: 25px;
        font-size: 22px;
        font-weight: 600;
        font-family: Segoe UI, sans-serif;
        letter-spacing: 2px;
      }
      
      .loading-subtitle {
        color: rgba(255, 255, 255, 0.6);
        margin-top: 10px;
        font-size: 14px;
        font-family: Segoe UI, sans-serif;
      }
      
      /* 淡出動畫 */
      .fade-out {
        opacity: 0;
        pointer-events: none;
      }
    </style>
    <script type="module" crossorigin src="/fishing-reel/assets/index-BSTvEGl5.js"></script>
    <link rel="stylesheet" crossorigin href="/fishing-reel/assets/index-BqQ8Dq3j.css">
  </head>
  <body>
    <noscript>
      <strong>
        請啟用 JavaScript 以使用樂咖大物輪網站
      </strong>
    </noscript>
    
    <div id="app"></div>
    
    <!-- ✅ Loading 畫面 -->
    <div id="app-loading">
      <div class="fishing-wheel"></div>
      <div class="loading-text">🔥 樂咖大物輪 🔥</div>
      <div class="loading-subtitle">載入中...</div>
    </div>
    
    <!-- ✅ 移除 Loading 的腳本 -->
    <script>
      // 正常情況由 useIntroAnimation 在主圖載入後移除 Loading；
      // 這裡只是保底，主圖或應用程式載入失敗時 Loading 不會永久蓋住畫面
      setTimeout(function () {
        var loader = document.getElementById("app-loading");
        if (loader) loader.remove();
      }, 5000);
    </script>
  </body>
</html>
