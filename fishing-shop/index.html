<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>樂咖大物輪 購物網站</title>
    <style>
      /* Loading 樣式 */
      #app-loading {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(135deg, #fef3f3 0%, #fff5f5 100%);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 9999;
        transition: opacity 0.5s ease, visibility 0.5s ease;
      }

      #app-loading.hidden {
        opacity: 0;
        visibility: hidden;
      }

      /* Logo 容器 */
      .loading-logo {
        width: 80px;
        height: 80px;
        background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
        border-radius: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 24px;
        box-shadow: 0 10px 40px rgba(239, 68, 68, 0.3);
        animation: logoFloat 2s ease-in-out infinite;
      }

      .loading-logo svg {
        width: 48px;
        height: 48px;
        color: white;
      }

      /* 標題 */
      .loading-title {
        font-size: 28px;
        font-weight: 700;
        color: #1f2937;
        margin-bottom: 8px;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
      }

      .loading-subtitle {
        font-size: 14px;
        color: #6b7280;
        margin-bottom: 32px;
      }

      /* 旋轉圓圈 */
      .loading-spinner {
        width: 48px;
        height: 48px;
        border: 4px solid #fee2e2;
        border-top-color: #ef4444;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }

      /* 動畫 */
      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      @keyframes logoFloat {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-10px); }
      }

      @media (prefers-reduced-motion: reduce) {
        #app-loading,
        .loading-logo,
        .loading-spinner {
          animation: none;
          transition: none;
        }
      }
    </style>
    <script type="module" crossorigin src="/fishing-shop/assets/index-Do1PlOBO.js"></script>
    <link rel="stylesheet" crossorigin href="/fishing-shop/assets/index-Cc04z3KK.css">
  </head>
  <body>
    <!-- Loading 畫面 -->
    <div id="app-loading">
      <div class="loading-logo">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z" />
        </svg>
      </div>
      <h1 class="loading-title">樂咖大物輪</h1>
      <p class="loading-subtitle">專注每一轉 • 成就每一釣</p>
      <div class="loading-spinner"></div>
    </div>

    <noscript>
      <style>#app-loading { display: none; }</style>
      請啟用 JavaScript 以使用樂咖大物輪購物網站
    </noscript>

    <!-- 主應用 -->
    <div id="app"></div>

    <script>
      // 保底：應用程式載入失敗時，Loading 不會永久蓋住畫面
      setTimeout(() => document.getElementById("app-loading")?.remove(), 8000);
    </script>
  </body>
</html>
